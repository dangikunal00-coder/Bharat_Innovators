<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Department Reports Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
      }
      #map {
        height: 600px;
        width: 100%;
      }
      .filters {
        padding: 10px;
        background: #f5f5f5;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      select,
      button {
        padding: 5px 10px;
        font-size: 14px;
      }
      .legend {
        background: white;
        padding: 10px;
        line-height: 1.5;
        border-radius: 5px;
        font-size: 14px;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
      }
      .legend div {
        display: flex;
        align-items: center;
      }
      .legend span {
        display: inline-block;
        width: 15px;
        height: 15px;
        margin-right: 8px;
      }
    </style>
  </head>
  <body>
    <h2>Department Reports Map</h2>

    <div class="filters">
      <label>Department:</label>
      <select id="departmentFilter">
        <option value="All">All Departments</option>
        <option value="Water Supply">Water Supply</option>
        <option value="Roads & Transport">Roads & Transport</option>
        <option value="Waste Management">Waste Management</option>
        <option value="Street Lighting">Street Lighting</option>
      </select>

      <label>Status:</label>
      <select id="statusFilter">
        <option value="All">All Status</option>
        <option value="Pending">Pending</option>
        <option value="Resolved">Resolved</option>
        <option value="In Progress">In Progress</option>
      </select>

      <button onclick="applyFilter()">Apply Filter</button>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
      // Initialize map
      var map = L.map("map").setView([28.6139, 77.209], 13);

      // Add OpenStreetMap tiles
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);

      // Data + markers
      let issues = [];
      var markersLayer = L.layerGroup().addTo(map);

      // Department colors
      var deptColors = {};
      var colorPalette = [
        "red",
        "blue",
        "green",
        "orange",
        "purple",
        "brown",
        "pink",
        "teal",
        "cyan",
        "magenta",
      ];

      function getDeptColor(dep) {
        if (!deptColors[dep]) {
          var color =
            colorPalette[Object.keys(deptColors).length % colorPalette.length];
          deptColors[dep] = color;
        }
        return deptColors[dep];
      }

      function showMarkers(filteredIssues) {
        markersLayer.clearLayers();

        filteredIssues.forEach((issue) => {
          var color = getDeptColor(issue.department);

          var marker = L.circleMarker([issue.lat, issue.lng], {
            radius: 8,
            fillColor: color,
            color: "#000",
            weight: 1,
            opacity: 1,
            fillOpacity: 0.8,
          }).addTo(markersLayer);

          marker.bindPopup(
            `<b>${issue.title}</b><br><b>Department:</b> ${issue.department}<br><b>Status:</b> ${issue.status}`
          );
        });

        // Update legend
        updateLegend();
      }

      function applyFilter() {
        var dep = document.getElementById("departmentFilter").value;
        var stat = document.getElementById("statusFilter").value;

        var filtered = issues.filter(
          (i) =>
            (dep === "All" || i.department === dep) &&
            (stat === "All" || i.status === stat)
        );

        showMarkers(filtered);
      }

      function updateLegend() {
        if (map.legendControl) {
          map.removeControl(map.legendControl);
        }

        var legend = L.control({ position: "bottomright" });

        legend.onAdd = function () {
          var div = L.DomUtil.create("div", "legend");
          div.innerHTML = "<strong>Departments</strong><br>";
          Object.keys(deptColors).forEach(function (dep) {
            div.innerHTML +=
              '<div><span style="background:' +
              deptColors[dep] +
              ';"></span>' +
              dep +
              "</div>";
          });
          return div;
        };

        legend.addTo(map);
        map.legendControl = legend;
      }

      // Fetch issues from backend
      fetch("/api/issues")
        .then((res) => res.json())
        .then((data) => {
          issues = data;
          applyFilter(); // show with default filter
        });
    </script>
  </body>
</html>
