<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Department Dashboard</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body {
        background-color: #f8f9fa;
      }
      .card {
        border-radius: 15px;
      }
      .sidebar {
        height: 100vh;
        background-color: #343a40;
        color: white;
        padding: 20px;
      }
      .sidebar h4 {
        margin-bottom: 30px;
      }
      .sidebar a {
        color: white;
        text-decoration: none;
        display: block;
        margin: 10px 0;
      }
      .sidebar a:hover {
        color: #ffc107;
      }
      .chart-container {
        height: 300px;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar">
          <h4>Dept Dashboard</h4>
          <a href="#">Dashboard</a>
          <a href="#">Pending Issues</a>
          <a href="#">Resolved Issues</a>
          <a href="#">Reports</a>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 p-4">
          <h2 class="mb-4">Department Dashboard</h2>

          <!-- Cards -->
          <div class="row mb-4">
            <div class="col-md-4">
              <div class="card text-bg-primary shadow p-3">
                <div class="card-body">
                  <h5 class="card-title">Total Issues</h5>
                  <h2 id="totalIssues">0</h2>
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="card text-bg-warning shadow p-3">
                <div class="card-body">
                  <h5 class="card-title">Pending Issues</h5>
                  <h2 id="pendingIssues">0</h2>
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="card text-bg-success shadow p-3">
                <div class="card-body">
                  <h5 class="card-title">Resolved Issues</h5>
                  <h2 id="resolvedIssues">0</h2>
                </div>
              </div>
            </div>
          </div>

          <!-- Charts -->
          <div class="row">
            <div class="col-md-6">
              <div class="card shadow p-3">
                <h5>Issues by Status</h5>
                <div class="chart-container">
                  <canvas id="statusChart"></canvas>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="card shadow p-3">
                <h5>Issues by Department</h5>
                <div class="chart-container">
                  <canvas id="categoryChart"></canvas>
                </div>
              </div>
            </div>
          </div>

          <!-- Table -->
          <div class="card mt-4 shadow p-3">
            <h5>Recent Issues</h5>
            <table class="table table-striped">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Title</th>
                  <th>Status</th>
                  <th>Department</th>
                  <th>Date Reported</th>
                </tr>
              </thead>
              <tbody id="issuesTable">
                <tr>
                  <td colspan="5" class="text-center">Loading...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap & ChartJS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      async function loadDashboardData() {
        try {
          // Fetch Stats
          const resStats = await fetch("/api/stats");
          const stats = await resStats.json();

          // Update Cards
          document.getElementById("totalIssues").innerText = stats.total;
          document.getElementById("pendingIssues").innerText = stats.pending;
          document.getElementById("resolvedIssues").innerText = stats.resolved;

          // Status Chart
          new Chart(document.getElementById("statusChart"), {
            type: "doughnut",
            data: {
              labels: ["Pending", "In Progress", "Resolved"],
              datasets: [
                {
                  data: [stats.pending, stats.in_progress, stats.resolved],
                  backgroundColor: ["#ffc107", "#17a2b8", "#28a745"],
                },
              ],
            },
            options: { maintainAspectRatio: false },
          });

          // Department Chart
          new Chart(document.getElementById("categoryChart"), {
            type: "bar",
            data: {
              labels: stats.by_department.map((d) => d.department),
              datasets: [
                {
                  label: "Issues",
                  data: stats.by_department.map((d) => d.count),
                  backgroundColor: "#007bff",
                },
              ],
            },
            options: { maintainAspectRatio: false },
          });

          // Fetch Recent Issues
          const resIssues = await fetch("/api/issues");
          const issues = await resIssues.json();

          const tableBody = document.getElementById("issuesTable");
          tableBody.innerHTML = ""; // clear placeholder

          issues.slice(0, 10).forEach((issue) => {
            const row = `
        <tr>
          <td>${issue.id}</td>
          <td>${issue.title}</td>
          <td><span class="badge ${
            issue.status === "Resolved"
              ? "bg-success"
              : issue.status === "Pending"
              ? "bg-warning"
              : "bg-info"
          }">${issue.status}</span></td>
          <td>${issue.department}</td>
          <td>${new Date(
            issue.created_at || Date.now()
          ).toLocaleDateString()}</td>
        </tr>
      `;
            tableBody.insertAdjacentHTML("beforeend", row);
          });
        } catch (err) {
          console.error("Error loading dashboard data", err);
        }
      }

      document.addEventListener("DOMContentLoaded", loadDashboardData);
    </script>
  </body>
</html>
