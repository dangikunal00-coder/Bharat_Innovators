<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Issue Heatmap with Filters</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"
    />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
      }
      #map {
        width: 100%;
        height: 600px;
      }
      .filters {
        padding: 10px;
        background: #f5f5f5;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      select,
      button {
        padding: 5px 10px;
        font-size: 14px;
      }
      .legend {
        padding: 10px;
        background: #fff;
        font-size: 14px;
        line-height: 1.5em;
        margin: 10px;
        border-radius: 5px;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
      }
      .legend span {
        display: inline-block;
        width: 12px;
        height: 12px;
        margin-right: 5px;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div class="filters">
      <label>Department:</label>
      <select id="departmentFilter">
        <option value="All">All Departments</option>
        <option value="Sanitation">Sanitation</option>
        <option value="Roads">Roads</option>
        <option value="Water">Water</option>
      </select>

      <label>Status:</label>
      <select id="statusFilter">
        <option value="All">All Status</option>
        <option value="Open">Open</option>
        <option value="Closed">Closed</option>
        <option value="In Progress">In Progress</option>
      </select>

      <button onclick="applyFilter()">Apply Filter</button>
    </div>

    <div id="map"></div>

    <div class="legend" id="legend">
      <strong>Department Colors:</strong><br />
      <span style="background: red"></span> Sanitation<br />
      <span style="background: blue"></span> Roads<br />
      <span style="background: green"></span> Water<br />
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/@turf/turf/6.5.0/turf.min.js"></script>

    <script>
      // Initialize map
      var map = L.map("map").setView([28.6139, 77.209], 12);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);

      // Sample issues
      var issues = [
        { lat: 28.6139, lng: 77.209, department: "Sanitation", status: "Open" },
        { lat: 28.62, lng: 77.21, department: "Roads", status: "Closed" },
        {
          lat: 28.625,
          lng: 77.215,
          department: "Sanitation",
          status: "In Progress",
        },
        { lat: 28.63, lng: 77.22, department: "Water", status: "Open" },
        { lat: 28.635, lng: 77.225, department: "Roads", status: "Open" },
        { lat: 28.64, lng: 77.23, department: "Sanitation", status: "Closed" },
      ];

      var deptColors = { Sanitation: "red", Roads: "blue", Water: "green" };

      // Heat and marker layers
      var heat = L.heatLayer([], { radius: 25, blur: 15 }).addTo(map);
      var markers = L.layerGroup().addTo(map);

      // Leaflet Draw setup
      var drawnItems = new L.FeatureGroup().addTo(map);
      var drawControl = new L.Control.Draw({
        draw: {
          rectangle: true,
          polygon: true,
          circle: false,
          polyline: false,
          marker: false,
          circlemarker: false,
        },
        edit: { featureGroup: drawnItems, remove: true },
      });
      map.addControl(drawControl);

      var selectedArea = null;
      map.on(L.Draw.Event.CREATED, function (e) {
        drawnItems.clearLayers();
        selectedArea = e.layer;
        drawnItems.addLayer(selectedArea);
        applyFilter();
      });

      map.on(L.Draw.Event.DELETED, function (e) {
        selectedArea = null;
        applyFilter();
      });

      function getHeatPoints(filteredIssues) {
        return filteredIssues.map((i) => [i.lat, i.lng, 1]);
      }

      function showMarkers(filteredIssues) {
        markers.clearLayers();
        filteredIssues.forEach((issue) => {
          var color = deptColors[issue.department] || "gray";
          var marker = L.circleMarker([issue.lat, issue.lng], {
            radius: 8,
            fillColor: color,
            color: "#000",
            weight: 1,
            opacity: 1,
            fillOpacity: 0.8,
          }).addTo(markers);
          marker.bindPopup(
            `<b>Department:</b> ${issue.department}<br><b>Status:</b> ${issue.status}`
          );
        });
      }

      function applyFilter() {
        var dep = document.getElementById("departmentFilter").value;
        var stat = document.getElementById("statusFilter").value;

        var filtered = issues.filter(
          (i) =>
            (dep === "All" || i.department === dep) &&
            (stat === "All" || i.status === stat)
        );

        // Area filter using Turf.js
        if (selectedArea) {
          filtered = filtered.filter((i) => {
            var pt = turf.point([i.lng, i.lat]);
            var poly = turf.polygon([
              selectedArea.getLatLngs()[0].map((ll) => [ll.lng, ll.lat]),
            ]);
            return turf.booleanPointInPolygon(pt, poly);
          });
        }

        heat.setLatLngs(getHeatPoints(filtered));
        showMarkers(filtered);
      }

      // Initialize all
      applyFilter();
    </script>
  </body>
</html>

<script>
  // Initialize map
  var map = L.map("map").setView([28.6139, 77.209], 12);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors",
  }).addTo(map);

  // Sample issues
  let issues = [];

  fetch("/api/issues")
    .then((res) => res.json())
    .then((data) => {
      issues = data; // populate global issues array
      applyFilter(); // render heatmap and markers
    });
  var deptColors = { sanitation: "red", roads: "blue", water: "green" };

  // Heat and marker layers
  var heat = L.heatLayer([], { radius: 25, blur: 15 }).addTo(map);
  var markers = L.layerGroup().addTo(map);

  // Leaflet Draw setup
  var drawnItems = new L.FeatureGroup().addTo(map);
  var drawControl = new L.Control.Draw({
    draw: {
      rectangle: true,
      polygon: true,
      circle: false,
      polyline: false,
      marker: false,
      circlemarker: false,
    },
    edit: { featureGroup: drawnItems, remove: true },
  });
  map.addControl(drawControl);

  var selectedArea = null;
  map.on(L.Draw.Event.CREATED, function (e) {
    drawnItems.clearLayers();
    selectedArea = e.layer;
    drawnItems.addLayer(selectedArea);
    applyFilter();
  });

  map.on(L.Draw.Event.DELETED, function (e) {
    selectedArea = null;
    applyFilter();
  });

  function getHeatPoints(filteredIssues) {
    return filteredIssues.map((i) => [i.lat, i.lng, 1]);
  }

  function normalizeDepartment(dep) {
    if (!dep) return "";
    return dep.trim().toLowerCase();
  }

  function showMarkers(filteredIssues) {
    markers.clearLayers();
    filteredIssues.forEach((issue) => {
      var color = deptColors[issue.department] || "gray";
      var marker = L.circleMarker([issue.lat, issue.lng], {
        radius: 8,
        fillColor: color,
        color: "#000",
        weight: 1,
        opacity: 1,
        fillOpacity: 0.8,
      }).addTo(markers);
      marker.bindPopup(
        `<b>Department:</b> ${issue.department}<br><b>Status:</b> ${issue.status}`
      );
    });
  }

  function applyFilter() {
    var dep = document.getElementById("departmentFilter").value;
    var stat = document.getElementById("statusFilter").value;

    var filtered = issues.filter(
      (i) =>
        (dep === "All" || i.department === dep) &&
        (stat === "All" || i.status === stat)
    );

    // Area filter using Turf.js
    if (selectedArea) {
      filtered = filtered.filter((i) => {
        var pt = turf.point([i.lng, i.lat]);
        var poly = turf.polygon([
          selectedArea.getLatLngs()[0].map((ll) => [ll.lng, ll.lat]),
        ]);
        return turf.booleanPointInPolygon(pt, poly);
      });
    }

    heat.setLatLngs(getHeatPoints(filtered));
    showMarkers(filtered);
  }
  console.log("Department from API:", issue.department);

  // Initialize all
  applyFilter();
</script>
